<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14B8A6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASIRI ERP">
<meta name="description" content="ASIRI ERP — Sistema de gestión completo para ASIRI La Boutique">
<title>ASIRI ERP 🦋</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8B%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blanco:#F8FAFB; --turquesa:#14B8A6; --turquesa-light:#CCFBF1;
    --rosado:#EC4899; --rosado-light:#FCE7F3;
    --dorado:#C9A84C; --dorado-light:#FEF9E7;
    --negro:#0F172A; --gris:#64748B; --gris-light:#F1F5F9;
    --violeta:#8B5CF6; --violeta-light:#EDE9FE;
    --sidebar-w:240px; --header-h:60px;
    --rojo:#EF4444; --verde:#059669;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--blanco);color:var(--negro);font-family:'Inter',sans-serif;overflow-x:hidden;}
  button,input,select,textarea{font-family:inherit;}

  /* ===== LAYOUT BASE ===== */
  #app{display:flex;min-height:100vh;}

  /* ===== SIDEBAR ===== */
  #sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--negro); color:white;
    position:fixed; top:0; left:0; bottom:0; z-index:200; overflow-y:auto;
    transition:transform .25s ease; display:flex; flex-direction:column;
  }
  .sb-brand{
    padding:1.2rem 1.4rem; display:flex; align-items:center; gap:.6rem;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sb-brand .butterfly{font-size:1.4rem;}
  .sb-brand-text{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;letter-spacing:.03em;}
  .sb-brand-text span{color:var(--turquesa);}
  .sb-nav{flex:1; padding:.8rem .6rem; display:flex; flex-direction:column; gap:.2rem;}
  .sb-item{
    display:flex; align-items:center; gap:.7rem; padding:.65rem .8rem; border-radius:10px;
    color:rgba(255,255,255,.65); cursor:pointer; font-size:.85rem; font-weight:500;
    transition:background .15s, color .15s; border:none; background:none; width:100%; text-align:left;
  }
  .sb-item:hover{background:rgba(255,255,255,.06); color:white;}
  .sb-item.active{background:linear-gradient(135deg, rgba(20,184,166,.25), rgba(236,72,153,.15)); color:white; box-shadow:inset 3px 0 0 var(--turquesa);}
  .sb-item .ic{font-size:1.1rem; width:22px; text-align:center;}
  .sb-item .num{font-family:'JetBrains Mono',monospace; font-size:.6rem; opacity:.5;}
  .sb-item.soon{opacity:.4; cursor:not-allowed;}
  .sb-item.soon:hover{background:none; color:rgba(255,255,255,.65);}
  .sb-item .soon-badge{
    margin-left:auto; font-size:.55rem; background:rgba(255,255,255,.1); padding:.15rem .4rem;
    border-radius:6px; letter-spacing:.05em; font-weight:700;
  }
  .sb-footer{padding:.9rem 1.4rem; font-size:.65rem; color:rgba(255,255,255,.35); border-top:1px solid rgba(255,255,255,.08);}

  /* ===== HEADER ===== */
  #main{flex:1; margin-left:var(--sidebar-w); display:flex; flex-direction:column; min-height:100vh;}
  header{
    height:var(--header-h); background:rgba(248,250,251,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(15,23,42,.08); display:flex; align-items:center;
    justify-content:space-between; padding:0 1.6rem; position:sticky; top:0; z-index:100;
  }
  .hdr-left{display:flex; align-items:center; gap:1rem;}
  #menu-toggle{display:none; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--negro);}
  .hdr-logo{font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:600; display:flex; align-items:center; gap:.4rem;}
  .hdr-right{display:flex; align-items:center; gap:1rem;}
  #save-indicator{
    font-size:.72rem; font-weight:600; padding:.35rem .8rem; border-radius:20px;
    display:flex; align-items:center; gap:.4rem; transition:all .2s;
  }
  #save-indicator.saved{background:var(--turquesa-light); color:#0F766E;}
  #save-indicator.saving{background:var(--dorado-light); color:#92400E;}
  #save-indicator.offline{background:var(--gris-light); color:var(--gris);}
  #conn-status{font-size:.7rem; font-weight:600; padding:.35rem .7rem; border-radius:20px; display:flex; align-items:center; gap:.35rem;}
  #conn-status.online{background:rgba(5,150,105,.1); color:var(--verde);}
  #conn-status.offline{background:rgba(239,68,68,.1); color:var(--rojo);}
  .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}

  /* ===== CONTENT ===== */
  #content{padding:1.6rem; flex:1;}
  .view{display:none; animation:fadeIn .25s ease;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .page-title{font-family:'Cormorant Garamond',serif; font-size:1.9rem; font-weight:600; margin-bottom:.2rem;}
  .page-sub{color:var(--gris); font-size:.85rem; margin-bottom:1.6rem;}

  /* ===== KPI CARDS ===== */
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-bottom:1.8rem;}
  .kpi-card{
    background:white; border:1px solid rgba(15,23,42,.07); border-radius:18px; padding:1.3rem 1.4rem;
    position:relative; overflow:hidden; transition:transform .15s, box-shadow .15s;
  }
  .kpi-card:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.06);}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--turquesa),var(--rosado));}
  .kpi-card.alert::before{background:linear-gradient(90deg,var(--rojo),#F97316);}
  .kpi-icon{font-size:1.4rem; margin-bottom:.5rem; display:block;}
  .kpi-label{font-size:.72rem; color:var(--gris); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-bottom:.3rem;}
  .kpi-value{font-family:'JetBrains Mono',monospace; font-size:1.7rem; font-weight:700; color:var(--negro);}
  .kpi-value.alert{color:var(--rojo);}
  .kpi-delta{font-size:.72rem; margin-top:.3rem; font-weight:600;}
  .kpi-delta.up{color:var(--verde);}
  .kpi-delta.down{color:var(--rojo);}

  /* ===== SECTIONS ===== */
  .section-row{display:grid; grid-template-columns:1.3fr 1fr; gap:1.2rem; margin-bottom:1.2rem;}
  @media (max-width:900px){.section-row{grid-template-columns:1fr;}}
  .panel{background:white; border:1px solid rgba(15,23,42,.07); border-radius:18px; padding:1.4rem;}
  .panel-title{font-weight:700; font-size:.95rem; margin-bottom:1rem; display:flex; align-items:center; gap:.5rem;}
  .panel-title .badge-live{font-size:.6rem; background:var(--turquesa-light); color:#0F766E; padding:.15rem .5rem; border-radius:8px; font-weight:700; letter-spacing:.05em;}

  /* Brief Claude */
  .brief-box{
    background:linear-gradient(135deg, rgba(20,184,166,.06), rgba(236,72,153,.05));
    border:1px solid rgba(20,184,166,.15); border-radius:14px; padding:1.1rem 1.2rem;
    font-size:.85rem; line-height:1.7; color:var(--negro);
  }
  .brief-box strong{color:var(--turquesa);}
  .brief-time{font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--gris); margin-top:.7rem; display:block;}

  /* Alertas */
  .alert-item{
    display:flex; align-items:flex-start; gap:.7rem; padding:.7rem .8rem; border-radius:12px;
    margin-bottom:.5rem; font-size:.8rem; line-height:1.5;
  }
  .alert-item:last-child{margin-bottom:0;}
  .alert-item.critico{background:rgba(239,68,68,.06); border-left:3px solid var(--rojo);}
  .alert-item.aviso{background:rgba(201,168,76,.08); border-left:3px solid var(--dorado);}
  .alert-item.info{background:rgba(20,184,166,.06); border-left:3px solid var(--turquesa);}
  .alert-icon{font-size:1rem;}
  .alert-text b{display:block; margin-bottom:.1rem;}
  .alert-text span{color:var(--gris); font-size:.75rem;}

  /* Tabla ventas */
  table.simple{width:100%; border-collapse:collapse; font-size:.82rem;}
  table.simple th{text-align:left; padding:.6rem .5rem; color:var(--gris); font-weight:600; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid rgba(15,23,42,.08);}
  table.simple td{padding:.65rem .5rem; border-bottom:1px solid rgba(15,23,42,.05);}
  table.simple tr:last-child td{border-bottom:none;}
  .canal-pill{font-size:.65rem; font-weight:700; padding:.15rem .5rem; border-radius:8px;}
  .canal-pill.shopify{background:var(--turquesa-light); color:#0F766E;}
  .canal-pill.pos{background:var(--rosado-light); color:#9D174D;}
  .canal-pill.manual{background:var(--dorado-light); color:#92400E;}

  /* Accesos rápidos */
  .quick-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.8rem;}
  .quick-card{
    background:white; border:1px solid rgba(15,23,42,.07); border-radius:14px; padding:1rem;
    text-align:center; cursor:pointer; transition:transform .15s, border-color .15s;
  }
  .quick-card:hover{transform:translateY(-3px); border-color:var(--turquesa);}
  .quick-card .qi{font-size:1.5rem; display:block; margin-bottom:.4rem;}
  .quick-card .qt{font-size:.75rem; font-weight:600;}

  /* Placeholder módulos */
  .placeholder-box{
    background:white; border:1px dashed rgba(15,23,42,.15); border-radius:18px;
    padding:3rem 1.5rem; text-align:center; color:var(--gris);
  }
  .placeholder-box .pi{font-size:2.2rem; display:block; margin-bottom:.8rem;}
  .placeholder-box h3{font-family:'Cormorant Garamond',serif; font-size:1.4rem; color:var(--negro); margin-bottom:.4rem;}
  .placeholder-box p{font-size:.85rem; max-width:400px; margin:0 auto;}
  .placeholder-box.soon{border-color:rgba(139,92,246,.3); background:var(--violeta-light);}
  .placeholder-box.soon h3{color:var(--violeta);}

  /* Botones */
  .btn{border:none; padding:.6rem 1.1rem; border-radius:10px; font-weight:600; font-size:.8rem; cursor:pointer; transition:transform .15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,var(--turquesa),var(--rosado)); color:white;}
  .btn-ghost{background:var(--gris-light); color:var(--negro);}

  /* Formulario / Modal genérico (reutilizable en todos los módulos) */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.55); display:none;
    align-items:center; justify-content:center; z-index:500; padding:1rem;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:white; border-radius:20px; padding:1.6rem; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;}
  .modal-box h3{font-family:'Cormorant Garamond',serif; font-size:1.3rem; margin-bottom:1rem;}
  .field{margin-bottom:.9rem;}
  .field label{display:block; font-size:.75rem; font-weight:600; color:var(--gris); margin-bottom:.3rem;}
  .field input, .field select, .field textarea{
    width:100%; padding:.6rem .7rem; border:1px solid rgba(15,23,42,.15); border-radius:10px; font-size:.85rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--turquesa);}
  .modal-actions{display:flex; gap:.6rem; margin-top:1.2rem;}
  .modal-actions .btn{flex:1;}

  /* ===== M1 CALCULADORA ===== */
  .tabs{display:flex; gap:.5rem; margin-bottom:1.4rem; flex-wrap:wrap;}
  .tab-btn{padding:.55rem 1rem; border-radius:10px; border:1px solid rgba(15,23,42,.1); background:white; font-size:.8rem; font-weight:600; cursor:pointer; color:var(--gris); transition:all .15s;}
  .tab-btn.active{background:linear-gradient(135deg,var(--turquesa),var(--rosado)); color:white; border-color:transparent;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadeIn .2s ease;}
  .calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; align-items:start;}
  @media(max-width:700px){.calc-grid{grid-template-columns:1fr;}}
  .calc-result{background:linear-gradient(135deg, rgba(20,184,166,.08), rgba(236,72,153,.06)); border-radius:14px; padding:1.2rem;}
  .calc-result .r-row{margin-bottom:1rem;}
  .calc-result .r-row:last-child{margin-bottom:0;}
  .calc-result .r-label{font-size:.7rem; color:var(--gris); text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  .calc-result .r-value{font-family:'JetBrains Mono',monospace; font-size:1.5rem; font-weight:700; color:var(--negro); margin:.15rem 0;}
  .calc-result .r-value.good{color:var(--verde);}
  .calc-result .r-value.bad{color:var(--rojo);}
  .calc-note{font-size:.75rem; color:var(--gris); line-height:1.6; margin-top:.8rem; padding-top:.8rem; border-top:1px solid rgba(15,23,42,.08);}
  .field-hint{font-size:.68rem; color:var(--gris); margin-top:.2rem;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:.8rem;}

  /* ===== M2 CRM ===== */
  .crm-toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.8rem; margin-bottom:1.2rem;}
  .crm-filters{display:flex; gap:.5rem; flex-wrap:wrap;}
  .filter-chip{padding:.4rem .85rem; border-radius:20px; font-size:.72rem; font-weight:700; cursor:pointer; border:2px solid transparent; transition:all .15s;}
  .filter-chip.f-all{background:var(--gris-light); color:var(--negro);}
  .filter-chip.f-vip{background:var(--dorado-light); color:#92400E;}
  .filter-chip.f-regular{background:var(--turquesa-light); color:#0F766E;}
  .filter-chip.f-dormida{background:rgba(239,68,68,.08); color:var(--rojo);}
  .filter-chip.f-nueva{background:var(--rosado-light); color:#9D174D;}
  .filter-chip.chip-active{border-color:var(--negro);}
  .crm-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1rem;}
  .clienta-card{background:white; border:1px solid rgba(15,23,42,.07); border-radius:16px; padding:1.1rem; cursor:pointer; transition:transform .15s, box-shadow .15s;}
  .clienta-card:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(0,0,0,.06);}
  .clienta-top{display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem; margin-bottom:.5rem;}
  .clienta-nombre{font-weight:700; font-size:.9rem;}
  .clienta-meta{font-size:.72rem; color:var(--gris); margin-top:.15rem;}
  .seg-badge{font-size:.6rem; font-weight:800; padding:.2rem .5rem; border-radius:8px; letter-spacing:.04em; white-space:nowrap;}
  .seg-badge.vip{background:var(--dorado-light); color:#92400E;}
  .seg-badge.regular{background:var(--turquesa-light); color:#0F766E;}
  .seg-badge.dormida{background:rgba(239,68,68,.1); color:var(--rojo);}
  .seg-badge.nueva{background:var(--rosado-light); color:#9D174D;}
  .clienta-stats{display:flex; justify-content:space-between; font-size:.75rem; margin-top:.7rem; padding-top:.7rem; border-top:1px solid rgba(15,23,42,.06); color:var(--gris);}
  .clienta-stats b{display:block; font-family:'JetBrains Mono',monospace; color:var(--negro); font-size:.85rem;}
  .reactivacion-box{
    background:rgba(239,68,68,.05); border:1px solid rgba(239,68,68,.2); border-radius:14px;
    padding:1rem 1.2rem; margin-bottom:1.2rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.7rem;
  }
  .reactivacion-box .rt{font-size:.85rem; font-weight:600; color:var(--negro);}
  .reactivacion-box .rt b{color:var(--rojo);}
  .ficha-row{display:flex; justify-content:space-between; padding:.55rem 0; border-bottom:1px solid rgba(15,23,42,.06); font-size:.83rem;}
  .ficha-row:last-child{border-bottom:none;}
  .ficha-row span:first-child{color:var(--gris);}
  .ficha-row span:last-child{font-weight:600;}
  .btn-wa{background:#25D366; color:white;}

  /* ===== M4 SHOPIFY RT ===== */
  .funnel{display:flex; flex-direction:column; gap:.7rem;}
  .funnel-step{display:flex; align-items:center; gap:.8rem;}
  .funnel-label{width:150px; font-size:.78rem; font-weight:600; flex-shrink:0;}
  .funnel-bar-bg{flex:1; height:32px; background:var(--gris-light); border-radius:8px; overflow:hidden;}
  .funnel-bar-fill{height:100%; background:linear-gradient(90deg,var(--turquesa),var(--rosado)); display:flex; align-items:center; padding-left:.6rem; color:white; font-size:.72rem; font-weight:700; border-radius:8px; transition:width 1s ease; white-space:nowrap;}
  .funnel-bar-fill.zero{background:linear-gradient(90deg,#EF4444,#F97316); width:2% !important; color:transparent;}
  .funnel-pct{width:64px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:.75rem; color:var(--gris); flex-shrink:0;}
  .funnel-note{font-size:.72rem; color:var(--gris); margin-top:.8rem; line-height:1.6;}

  .lastunit-banner{
    background:rgba(239,68,68,.06); border:1px solid rgba(239,68,68,.2); border-radius:14px;
    padding:1rem 1.2rem; margin-bottom:1.2rem; font-size:.85rem; color:var(--negro);
  }
  .lastunit-banner b{color:var(--rojo);}
  .lastunit-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.8rem;}
  .lastunit-card{background:white; border:1px solid rgba(239,68,68,.2); border-radius:14px; overflow:hidden; position:relative;}
  .lastunit-card img{width:100%; height:100px; object-fit:cover; display:block; background:var(--gris-light);}
  .lastunit-badge{position:absolute; top:.5rem; left:.5rem; background:var(--rojo); color:white; font-size:.58rem; font-weight:800; padding:.2rem .45rem; border-radius:6px; letter-spacing:.03em;}
  .lastunit-info{padding:.6rem .7rem;}
  .lastunit-info .ln{font-size:.76rem; font-weight:700; margin-bottom:.15rem; line-height:1.3;}
  .lastunit-info .lp{font-family:'JetBrains Mono',monospace; font-size:.78rem; color:var(--turquesa);}

  .carrito-item{display:flex; justify-content:space-between; align-items:center; gap:.8rem; padding:.8rem 1rem; border-radius:12px; background:var(--gris-light); margin-bottom:.6rem;}
  .carrito-item:last-child{margin-bottom:0;}
  .carrito-info b{display:block; font-size:.83rem;}
  .carrito-info span{font-size:.72rem; color:var(--gris);}

  /* ===== M5 VENTAS — CAJA UNIFICADA ===== */
  .canal-total-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.8rem; margin-bottom:1.2rem;}
  .canal-total-card{background:white; border:1px solid rgba(15,23,42,.07); border-radius:14px; padding:1rem 1.1rem; text-align:center;}
  .canal-total-card .ct-canal{font-size:.68rem; font-weight:700; text-transform:uppercase; color:var(--gris); letter-spacing:.05em;}
  .canal-total-card .ct-monto{font-family:'JetBrains Mono',monospace; font-size:1.25rem; font-weight:700; margin-top:.3rem; color:var(--negro);}
  .canal-total-card.total{background:linear-gradient(135deg, rgba(20,184,166,.08), rgba(236,72,153,.06)); border-color:rgba(20,184,166,.2);}
  .canal-total-card.total .ct-monto{color:var(--turquesa); font-size:1.4rem;}

  .hora-bar-row{display:flex; align-items:center; gap:.6rem; margin-bottom:.55rem;}
  .hora-label{width:52px; font-size:.72rem; color:var(--gris); font-family:'JetBrains Mono',monospace; flex-shrink:0;}
  .hora-bar-bg{flex:1; height:16px; background:var(--gris-light); border-radius:6px; overflow:hidden;}
  .hora-bar-fill{height:100%; background:linear-gradient(90deg,var(--turquesa),var(--rosado)); border-radius:6px; transition:width .6s ease;}
  .hora-val{width:76px; text-align:right; font-size:.72rem; font-family:'JetBrains Mono',monospace; flex-shrink:0;}

  .proyeccion-box{
    background:linear-gradient(135deg, rgba(201,168,76,.08), rgba(236,72,153,.05));
    border:1px solid rgba(201,168,76,.25); border-radius:14px; padding:1.2rem;
  }
  .proyeccion-box .py-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--gris); font-weight:700;}
  .proyeccion-box .py-value{font-family:'JetBrains Mono',monospace; font-size:1.8rem; font-weight:700; color:var(--negro); margin:.2rem 0 .6rem;}

  /* ===== M3 ADS ===== */
  .campana-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1rem;}
  .campana-card{background:white; border:1px solid rgba(15,23,42,.07); border-radius:16px; padding:1.1rem;}
  .campana-top{display:flex; justify-content:space-between; align-items:flex-start; gap:.5rem; margin-bottom:.5rem;}

/* Clean Data Engine — detecta problemas reales cruzando CRM (M2) y Compras (M6) */
function detectarProblemasLimpieza(){
  const problemas = [];
  // Duplicados de teléfono en CRM
  const telefonos = {};
  CRM_DEMO.forEach(c => { telefonos[c.telefono] = (telefonos[c.telefono]||0) + 1; });
  Object.keys(telefonos).forEach(tel => {
    if(telefonos[tel] > 1) problemas.push({id:'dup-'+tel, texto:`Teléfono duplicado en CRM: ${tel}`});
  });
  // Clientas registradas sin ninguna compra
  CRM_DEMO.filter(c => c.compras === 0).forEach(c => {
    problemas.push({id:'sincompra-'+c.id, texto:`${c.nombre} está registrada pero nunca compró — considera reactivar o archivar`});
  });
  // Órdenes de compra pendientes
  ORDENES_DEMO.forEach((o,i) => {
    if(o.estado === 'pendiente') problemas.push({id:'orden-'+i, texto:`Orden pendiente sin seguimiento: ${o.producto} (${o.proveedor})`});
  });
  return problemas;
}

/* Resumen ejecutivo — cruza datos reales de M2 CRM, M5 Ventas, M6 Compras y M7 Finanzas */
function calcularResumenMensual(){
  const totalHoy = DATA_DEMO.ventas.reduce((s,v) => s + v.monto, 0);
  const diaDelMes = 23, diasDelMes = 31;
  const ventasProyectadasMes = Math.round((totalHoy / diaDelMes) * diasDelMes);
  const comprasTotal = ORDENES_DEMO.reduce((s,o) => s + o.cantidad*o.costo, 0);
  const f29 = calcularF29();
  const ingresosTotal = f29.libro.filter(m => m.tipo === 'ingreso').reduce((s,m) => s + m.total, 0);
  const egresosTotal = f29.libro.filter(m => m.tipo === 'egreso').reduce((s,m) => s + m.total, 0);
  const resultadoNeto = ingresosTotal - egresosTotal - f29.totalAPagar;
  return {
    totalHoy, ventasProyectadasMes, comprasTotal, resultadoNeto, f29,
    clientasTotales: CRM_DEMO.length,
    clientasVIP: CRM_DEMO.filter(c => segmentarClienta(c).key === 'vip').length,
    ordenesCompra: ORDENES_DEMO.length,
    conversion: 0
  };
}

function calcPrecioVenta(){
  const costo = Number(document.getElementById('pv-costo').value) || 0;
  const margen = Number(document.getElementById('pv-margen').value) || 0;
  const comision = Number(document.getElementById('pv-comision').value) || 0;
  const envio = Number(document.getElementById('pv-envio').value) || 0;
  const divisor = 1 - ((margen + comision) / 100);
  const precio = divisor > 0 ? (costo + envio) / divisor : 0;
  const utilidad = precio - costo - envio - (precio * comision / 100);
  document.getElementById('pv-resultado').textContent = '$' + Math.round(precio).toLocaleString('es-CL');
  document.getElementById('pv-utilidad').textContent = '$' + Math.round(utilidad).toLocaleString('es-CL');
  autoSave();
}

function calcROI(){
  const inv = Number(document.getElementById('roi-inversion').value) || 0;
  const ventas = Number(document.getElementById('roi-ventas').value) || 0;
  const roi = inv > 0 ? ((ventas - inv) / inv) * 100 : 0;
  const roas = inv > 0 ? ventas / inv : 0;
  const el = document.getElementById('roi-resultado');
  el.textContent = roi.toFixed(1) + '%';
  el.className = 'r-value ' + (roi >= 0 ? 'good' : 'bad');
  document.getElementById('roi-roas').textContent = roas.toFixed(2) + 'x';
  const formato = document.getElementById('roi-formato').value;
  const historico = {'reel-fb':36.8, 'historia-ig':7.5, 'reel-ig':3.1, 'otro':null};
  const h = historico[formato];
  document.getElementById('roi-nota').textContent = h !== null
    ? `Tu histórico en este formato es ${h}% ROI. ${roi >= h ? '✅ Vas por encima del histórico.' : '⚠️ Vas por debajo del histórico — revisa audiencia o creativo.'}`
    : 'Formato sin histórico registrado en ASIRI.';
  autoSave();
}

function calcEquilibrio(){
  const fijos = Number(document.getElementById('pe-fijos').value) || 0;
  const precio = Number(document.getElementById('pe-precio').value) || 0;
  const variable = Number(document.getElementById('pe-variable').value) || 0;
  const margenContrib = precio - variable;
  const unidades = margenContrib > 0 ? Math.ceil(fijos / margenContrib) : 0;
  document.getElementById('pe-unidades').textContent = unidades.toLocaleString('es-CL');
  document.getElementById('pe-ventas').textContent = '$' + (unidades * precio).toLocaleString('es-CL');
  autoSave();
}

function calcDescuento(){
  const precio = Number(document.getElementById('sd-precio').value) || 0;
  const costo = Number(document.getElementById('sd-costo').value) || 0;
  const pct = Number(document.getElementById('sd-pct').value) || 0;
  const final = precio * (1 - pct / 100);
  const margen = final > 0 ? ((final - costo) / final) * 100 : 0;
  document.getElementById('sd-pct-label').textContent = pct + '%';
  document.getElementById('sd-final').textContent = '$' + Math.round(final).toLocaleString('es-CL');
  const elMargen = document.getElementById('sd-margen');
  elMargen.textContent = margen.toFixed(1) + '%';
  elMargen.className = 'r-value ' + (margen >= 20 ? 'good' : 'bad');
  document.getElementById('sd-nota').textContent = margen < 20
    ? '⚠️ Margen bajo el 20% — este descuento puede no ser rentable.'
    : '✅ Margen saludable con este descuento.';
  autoSave();
}

  const bloques = ['09-11h','11-13h','13-15h','15-17h','17-19h','19-21h'];

/* Construye el Libro IyE a partir de ventas reales (M5) y compras reales (M6) */
function construirLibroIyE(){
  const ingresos = DATA_DEMO.ventas.map(v => ({
    fecha: '23 jul', tipo:'ingreso', doc: v.canal === 'shopify' ? 'Boleta Web' : v.canal === 'pos' ? 'Boleta MP POS' : 'Boleta Manual',
    concepto: v.producto, total: v.monto
  }));
  const egresos = ORDENES_DEMO.map(o => ({
    fecha: '23 jul', tipo:'egreso', doc:'Factura Proveedor',
    concepto: `${o.producto} (${o.proveedor})`, total: o.cantidad * o.costo
  }));
  return [...ingresos, ...egresos].map(m => {
    const neto = Math.round(m.total / 1.19);
    const iva = m.total - neto;
    return {...m, neto, iva};
  });
}

function calcularF29(){
  const libro = construirLibroIyE();
  const ivaDebito = libro.filter(m => m.tipo === 'ingreso').reduce((s,m) => s + m.iva, 0);
  const ivaCredito = libro.filter(m => m.tipo === 'egreso').reduce((s,m) => s + m.iva, 0);
  const ventasNetas = libro.filter(m => m.tipo === 'ingreso').reduce((s,m) => s + m.neto, 0);
  const ivaDeterminado = ivaDebito - ivaCredito;
  const ppm = Math.round(ventasNetas * (TASA_PPM / 100));
  const totalAPagar = Math.max(ivaDeterminado, 0) + ppm;
  return { libro, ivaDebito, ivaCredito, ventasNetas, ivaDeterminado, ppm, totalAPagar };
}

function renderFlujoCaja(){
  const saldoInicial = 850000; // ajustar con saldo bancario real de ASIRI
  const totalHoy = DATA_DEMO.ventas.reduce((s,v) => s + v.monto, 0);
  const totalEgresosHoy = ORDENES_DEMO.reduce((s,o) => s + o.cantidad*o.costo, 0);
  const promedioIngresoDiario = totalHoy; // referencia: caja de hoy como proxy diario
  const promedioEgresoDiario = totalEgresosHoy / 31;

  const checkpoints = [5,10,15,20,25,30];
  const saldos = checkpoints.map(dia => Math.round(saldoInicial + dia*(promedioIngresoDiario - promedioEgresoDiario)));
  const maxAbs = Math.max(...saldos.map(s => Math.abs(s)), 1);
  const hayNegativo = saldos.some(s => s < 0);

  const filas = checkpoints.map((dia,i) => `
    <div class="flujo-bar-row">
      <div class="flujo-label">Día ${dia}</div>
      <div class="flujo-bar-bg"><div class="flujo-bar-fill ${saldos[i]<0?'neg':''}" style="width:${Math.min((Math.abs(saldos[i])/maxAbs)*100,100)}%"></div></div>
      <div class="flujo-val">$${saldos[i].toLocaleString('es-CL')}</div>
    </div>
  `).join('');

  return `
    ${filas}
    <div class="calc-note">Saldo inicial referencial $${saldoInicial.toLocaleString('es-CL')} + proyección lineal según tu venta e compra promedio diarias actuales. Ajustar saldo inicial con tu cuenta bancaria real.</div>
    ${hayNegativo ? `<div class="flujo-alerta">⚠️ El flujo proyectado cae bajo $0 en algún punto de los próximos 30 días. Revisa gastos comprometidos o acelera cobranzas antes de que ocurra.</div>` : ''}
  `;
}

/* ---------- Export Excel — formato SpreadsheetML (XML nativo, sin librerías) ---------- */
function xmlEsc(v){
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function celda(valor, tipo){
  tipo = tipo || (typeof valor === 'number' ? 'Number' : 'String');
  return `<Cell><Data ss:Type="${tipo}">${xmlEsc(valor)}</Data></Cell>`;
}
function filaXml(celdas){
  return `<Row>${celdas.join('')}</Row>`;
}
function hojaXml(nombre, filas){
  return `<Worksheet ss:Name="${xmlEsc(nombre)}"><Table>${filas.join('')}</Table></Worksheet>`;
}

function exportarExcel(){
  const r = calcularResumenMensual();

  const hojaResumen = hojaXml('Resumen', [
    filaXml([celda('KPI'), celda('Valor')]),
    filaXml([celda('Ventas Proyectadas Mes'), celda(r.ventasProyectadasMes)]),
    filaXml([celda('Clientas Totales'), celda(r.clientasTotales)]),
    filaXml([celda('Clientas VIP'), celda(r.clientasVIP)]),
    filaXml([celda('Compras del Mes'), celda(r.comprasTotal)]),
    filaXml([celda('Resultado Neto Estimado'), celda(r.resultadoNeto)]),
    filaXml([celda('IVA Determinado'), celda(r.f29.ivaDeterminado)]),
  ]);

  const hojaVentas = hojaXml('Ventas', [
    filaXml([celda('Hora'), celda('Producto'), celda('Canal'), celda('Monto')]),
    ...DATA_DEMO.ventas.map(v => filaXml([celda(v.hora), celda(v.producto), celda(v.canal), celda(v.monto)]))
  ]);

  const hojaCRM = hojaXml('CRM Clientas', [
    filaXml([celda('Nombre'), celda('Teléfono'), celda('Compras'), celda('LTV'), celda('Días Última Compra'), celda('Segmento')]),
    ...CRM_DEMO.map(c => filaXml([celda(c.nombre), celda(c.telefono), celda(c.compras), celda(c.ltv), celda(c.diasUltimaCompra), celda(segmentarClienta(c).label)]))
  ]);

  const hojaCompras = hojaXml('Compras', [
    filaXml([celda('Proveedor'), celda('Producto'), celda('Cantidad'), celda('Costo Unitario'), celda('Total'), celda('Estado')]),
    ...ORDENES_DEMO.map(o => filaXml([celda(o.proveedor), celda(o.producto), celda(o.cantidad), celda(o.costo), celda(o.cantidad*o.costo), celda(o.estado)]))
  ]);

  const workbook = `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
${hojaResumen}${hojaVentas}${hojaCRM}${hojaCompras}
</Workbook>`;

  const blob = new Blob([workbook], {type:'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ASIRI_ERP_Informe.xls';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   8. AUTOGUARDADO — debounce 1.5s
   Si online → POST a Apps Script webhook
   Si offline → guarda en IndexedDB, sincroniza al reconectar
   ============================================================ */

// ⚠️ Reemplazar con la URL real del webhook al desplegar Apps Script (M6 "Implementar como app web")
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/TU_ID_DE_IMPLEMENTACION/exec';

let saveTimer = null;
const indicator = () => document.getElementById('save-indicator');

function autoSave(immediate){
  clearTimeout(saveTimer);
  setIndicator('saving');
  const run = () => guardarDatos();
  if(immediate){ run(); } else { saveTimer = setTimeout(run, 1500); }
}

function setIndicator(state){
  const el = indicator();
  if(!el) return;
  el.className = state;
  if(state === 'saving') el.innerHTML = '⚠ Guardando...';
  else if(state === 'saved') el.innerHTML = '✓ Guardado';
  else if(state === 'offline') el.innerHTML = '📴 Offline — guardado local';
}

async function guardarDatos(){
  const payload = { timestamp: new Date().toISOString(), origen:'ASIRI-ERP', data: DATA_DEMO };

  if(!navigator.onLine){
    await guardarEnIndexedDB(payload);
    setIndicator('offline');
    return;
  }

  try{
    await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      mode:'no-cors', // Apps Script webhooks requieren no-cors desde front simple
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(payload)
    });
    setIndicator('saved');
  }catch(err){
    // Si falla el POST (sin URL configurada aún, o sin red) → fallback local
    await guardarEnIndexedDB(payload);
    setIndicator('offline');
  }
}

/* ---------- 9. INDEXEDDB (offline) ---------- */
let dbPromise = null;
function abrirDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('asiri-erp-db', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('pendientes')){
        db.createObjectStore('pendientes', {keyPath:'timestamp'});
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
  return dbPromise;
}

async function guardarEnIndexedDB(payload){
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('pendientes','readwrite');
    tx.objectStore('pendientes').put(payload);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

async function sincronizarPendientes(){
  const db = await abrirDB();
  const tx = db.transaction('pendientes','readonly');
  const all = await new Promise((resolve) => {
    const req = tx.objectStore('pendientes').getAll();
    req.onsuccess = () => resolve(req.result);
  });
  if(!all.length) return;

  for(const payload of all){
    try{
      await fetch(APPS_SCRIPT_URL, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain'},
        body: JSON.stringify(payload)
      });
    }catch(e){ /* se reintenta en la próxima reconexión */ }
  }
  // limpiar cola sincronizada
  const dbw = await abrirDB();
  const txw = dbw.transaction('pendientes','readwrite');
  txw.objectStore('pendientes').clear();
  setIndicator('saved');
}

/* ---------- 10. ESTADO DE CONEXIÓN ---------- */
function actualizarEstadoConexion(){
  const el = document.getElementById('conn-status');
  if(navigator.onLine){
    el.className = 'online';
    el.innerHTML = '<span class="dot"></span>Online';
    sincronizarPendientes();
  }else{
    el.className = 'offline';
    el.innerHTML = '<span class="dot"></span>Offline';
    setIndicator('offline');
  }
}
window.addEventListener('online', actualizarEstadoConexion);
window.addEventListener('offline', actualizarEstadoConexion);

/* ---------- 11. PWA — Service Worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW no registrado:', err));
  });
}

/* ---------- 12. INIT ---------- */
document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  initViews();
  actualizarEstadoConexion();
  setIndicator('saved');
});
